name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Use the latest npm (trusted publishing needs npm >= 11.5.1)
        run: npm install --global npm@latest

      - name: Check syntax
        run: node --check lib/client.js

      - name: Run tests
        run: node --test test/*.test.mjs

      - name: Verify the tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(node -p "require('./package.json').version")"
          test "$TAG" = "$VERSION"

      - name: Inspect the package contents
        run: npm pack --dry-run

      - name: Install the packed tarball in a clean directory
        run: |
          TARBALL="$(npm pack --silent)"
          mkdir -p /tmp/dsh-comfyui-studio-install
          cd /tmp/dsh-comfyui-studio-install
          npm init -y >/dev/null
          npm install --silent "${GITHUB_WORKSPACE}/${TARBALL}"
          node -e "const p=require('dsh-comfyui-studio/package.json'); if (!p.dsh?.bundle?.patch) process.exit(1); console.log(p.name, p.version, p.dsh.bundle.patch)"
          rm -f "${GITHUB_WORKSPACE}/${TARBALL}"

      - name: Publish with provenance
        run: npm publish --provenance --access public

      - name: Wait until npm exposes the version
        id: npm-visible
        continue-on-error: true
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for attempt in $(seq 1 40); do
            PUBLISHED="$(npm view "dsh-comfyui-studio@${VERSION}" version --prefer-online 2>/dev/null | tail -n 1)"
            if [ "${PUBLISHED}" = "${VERSION}" ]; then
              echo "dsh-comfyui-studio@${VERSION} is live"
              exit 0
            fi
            sleep 15
          done
          echo "::warning::npm published dsh-comfyui-studio@${VERSION} but its metadata is still propagating; index sync will retry."
          exit 1

      - name: Sync the plugin index
        id: sync-index
        continue-on-error: true
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git pull --ff-only origin main

          SYNCED=false
          for attempt in $(seq 1 40); do
            if node scripts/sync-release.mjs "${VERSION}"; then
              SYNCED=true
              break
            fi
            sleep 15
          done
          if [ "${SYNCED}" != "true" ]; then
            echo "::error::Could not sync plugin-index.json for dsh-comfyui-studio@${VERSION} after retries."
            exit 1
          fi

          if git diff --quiet -- plugin-index.json; then
            echo "plugin index already contains ${VERSION}"
            exit 0
          fi
          git add plugin-index.json
          git commit -m "Point plugin index at ${VERSION}"
          git push origin main

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${GITHUB_REF_NAME#v}"
          gh release view "${TAG}" >/dev/null 2>&1 || gh release create "${TAG}" --title "${TAG}" --notes-file CHANGELOG.md

      - name: Surface a deferred index repair
        if: steps.sync-index.outcome != 'success'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "::error::npm published dsh-comfyui-studio@${VERSION} but plugin-index.json was not synced. Run the 'Repair plugin index' workflow with version ${VERSION}."
          exit 1
